name: ci

# Portable checks only. GPU, CUDA and Mac qualification run on the hardware
# hosts, not here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check-script unit tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -I -m unittest discover -s scripts/tests
      - name: Doc links
        run: python3 scripts/check_doc_links.py

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # With no arguments, rustup reads the toolchain and components from
      # rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy (CPU-only default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Qualification inventory
        run: python3 ../scripts/qual_inventory.py validate
      - name: Pack qualification registry
        run: python3 ../scripts/qual_inventory.py packs
      - name: Tests (CPU-only default features, evidence and minimum-ran floor)
        run: |
          status=0
          python3 ../scripts/qual_inventory.py collect \
            --surface host-portable --out "$RUNNER_TEMP/qual-host-portable" || status=$?
          if [ "$status" -ne 0 ]; then
            for stream in stdout stderr; do
              log="$RUNNER_TEMP/qual-host-portable/host-portable.$stream"
              if [ -f "$log" ]; then cat "$log"; fi
            done
          fi
          if [ -f "$RUNNER_TEMP/qual-host-portable/evidence.json" ]; then
            cat "$RUNNER_TEMP/qual-host-portable/evidence.json"
          elif [ "$status" -eq 0 ]; then
            echo 'Qualification completed without evidence.json' >&2
            exit 1
          fi
          exit "$status"
