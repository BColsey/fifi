name: ci

# Portable checks only. GPU, CUDA and Mac qualification run on the hardware
# hosts, not here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # With no arguments, rustup reads the toolchain and components from
      # rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy (CPU-only default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (CPU-only default features)
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        # This job runs the tests directly and reports pass or fail.
        run: cargo test --locked --no-fail-fast
