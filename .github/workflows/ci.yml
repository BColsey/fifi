name: ci

# Portable checks only. GPU, CUDA and Mac qualification run on the hardware hosts, not here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check-script unit tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -I -m unittest discover -s scripts/tests
      - name: Doc links
        run: python3 scripts/check_doc_links.py

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # With no arguments, rustup reads the toolchain and components from rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Clippy (CPU-only default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (CPU-only default features)
        run: cargo test --locked
